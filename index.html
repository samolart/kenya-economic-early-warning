<style>
/* Layout: sticky control bar, five switchable views, charts drawn as scaled SVG on a quiet cool-grey ground */
:root{
  --bg:#EBEEF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#12202E; --muted:#5A6B7C; --line:#D6DDE5;
  --accent:#1D4ED8; --accent-soft:#DCE6FF; --peer:#8795A5;
  --b-low:#1F9D74; --b-mod:#DDA82C; --b-high:#E8772E; --b-sev:#C2273D;
  --f-disp:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(18,32,46,.06),0 6px 20px rgba(18,32,46,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B131C; --surface:#121D29; --surface2:#182635; --ink:#E7EDF3; --muted:#8FA2B4; --line:#243547;
  --accent:#6C9BFF; --accent-soft:#1B2E55; --peer:#6F8296;
  --b-low:#34C79A; --b-mod:#F0C255; --b-high:#F28B4B; --b-sev:#F2566B; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B131C; --surface:#121D29; --surface2:#182635; --ink:#E7EDF3; --muted:#8FA2B4; --line:#243547;
  --accent:#6C9BFF; --accent-soft:#1B2E55; --peer:#6F8296;
  --b-low:#34C79A; --b-mod:#F0C255; --b-high:#F28B4B; --b-sev:#F2566B; --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.bar-top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font:700 clamp(24px,4vw,38px)/1.05 var(--f-disp);letter-spacing:-.02em;margin:0;text-wrap:balance}
.kicker{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.sel{display:flex;gap:8px;align-items:center;font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select{font:500 14px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 28px 8px 10px;min-height:38px}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:2px;margin-top:14px;overflow-x:auto}
nav button{font:500 14px var(--f-body);color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:hover{color:var(--ink)}
main{padding-top:22px;display:grid;gap:18px}
.view[hidden]{display:none}
.view{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font:700 17px/1.25 var(--f-disp);margin:0 0 4px;letter-spacing:-.01em;text-wrap:balance}
.card .sub{color:var(--muted);margin:0 0 12px;font-size:13px;max-width:70ch}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpi .lab{font:500 11px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font:500 34px/1.1 var(--f-mono);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;color:var(--muted)}
.kpi .dl{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;color:#fff;vertical-align:middle}
.pill.Low{background:var(--b-low)}.pill.Moderate{background:var(--b-mod);color:#1b1500}.pill.High{background:var(--b-high);color:#1b0b00}.pill.Severe{background:var(--b-sev)}
.warn{border-left:4px solid var(--b-high)}
.gauge{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:12px;position:relative}
.gauge i{display:block;height:100%}
.gauge b{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
svg text.k{fill:var(--accent);font-weight:500}
svg .ink{fill:var(--ink)}
.scroll{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr.me td{background:var(--accent-soft);font-weight:600}
.cellbar{position:relative;min-width:90px}
.cellbar i{position:absolute;left:0;top:50%;height:60%;transform:translateY(-50%);background:var(--peer);opacity:.28;border-radius:2px}
.cellbar span{position:relative}
.me .cellbar i{background:var(--accent);opacity:.35}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-mono);padding:8px 10px;border-radius:6px;max-width:240px;opacity:0;transition:opacity .08s}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);font:500 13px var(--f-body)}
.opt small{display:block;color:var(--muted);font:400 12px var(--f-mono);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);max-width:75ch}
.big{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font:12px var(--f-mono);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

function lineChart(id,o){
 const w=o.w||760,h=o.h||300,m=Object.assign({l:40,r:14,t:12,b:26},o.m||{});
 const sx=x=>m.l+(x-o.xmin)/(o.xmax-o.xmin)*(w-m.l-m.r), sy=y=>h-m.b-(y-o.ymin)/(o.ymax-o.ymin)*(h-m.t-m.b);
 let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.label||''}" data-cid="${id}">`;
 (o.zones||[]).forEach(z=>s+=`<rect x="${m.l}" width="${w-m.l-m.r}" y="${sy(z.y1)}" height="${sy(z.y0)-sy(z.y1)}" fill="${z.fill}" opacity="${z.op||.07}"/>`);
 (o.yticks||[]).forEach(t=>s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)" stroke-width="${t===0&&o.zero?1.5:1}"/><text x="${m.l-8}" y="${sy(t)+4}" text-anchor="end">${t}</text>`);
 (o.xticks||[]).forEach(t=>s+=`<text x="${sx(t)}" y="${h-6}" text-anchor="middle">${t}</text>`);
 (o.refs||[]).forEach(r=>s+=`<line x1="${m.l}" x2="${w-m.r}" y1="${sy(r.y)}" y2="${sy(r.y)}" stroke="var(--muted)" stroke-dasharray="4 4"/><text x="${w-m.r-4}" y="${sy(r.y)-5}" text-anchor="end">${r.t}</text>`);
 (o.bands||[]).forEach(b=>{const up=b.pts.map(p=>`${sx(p[0])},${sy(p[2])}`),dn=b.pts.slice().reverse().map(p=>`${sx(p[0])},${sy(p[1])}`);s+=`<polygon points="${up.concat(dn).join(' ')}" fill="${b.fill}" opacity="${b.op||.18}"/>`});
 (o.lines||[]).forEach(l=>{let d='',pen=false;l.pts.forEach(p=>{if(p[1]==null){pen=false;return}d+=(pen?'L':'M')+sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1);pen=true});
  s+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="${l.w||2}" ${l.dash?`stroke-dasharray="${l.dash}"`:''} stroke-linejoin="round" stroke-linecap="round"/>`;
  if(l.dots)l.pts.forEach(p=>{if(p[1]!=null)s+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="${l.dots}" fill="${l.color}"/>`});
  if(l.end){const p=l.pts.filter(q=>q[1]!=null).at(-1);if(p)s+=`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4.5" fill="${l.color}" stroke="var(--surface)" stroke-width="2"/>`}});
 (o.bars||[]).forEach(b=>{const bw=(w-m.l-m.r)/(o.xmax-o.xmin+1)*.62;b.pts.forEach(p=>{if(p[1]==null)return;const y0=sy(0),y1=sy(p[1]);s+=`<rect x="${sx(p[0])-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.abs(y1-y0)}" fill="${b.color}" opacity=".85"/>`})});
 (o.notes||[]).forEach(n=>s+=`<text x="${sx(n.x)+(n.dx||0)}" y="${sy(n.y)+(n.dy||0)}" text-anchor="${n.a||'middle'}" class="k">${n.t}</text>`);

 const c=state.country;
 const st=COUNTRIES.map(n=>{const r=by(n);return {n,g:mean(r.map(x=>x.gdp_growth)),i:mean(r.map(x=>x.inflation)),s:mean(r.map(x=>x.stress_index)),l:r.at(-1).stress_index,pk:r.reduce((a,b)=>b.stress_index>a.stress_index?b:a),sl:r.filter(x=>x.slump_next===1).length,sd:Math.sqrt(mean(r.map(x=>(x.gdp_growth-mean(r.map(z=>z.gdp_growth)))**2)))}});
 const w=620,h=360,m={l:46,r:30,t:16,b:40},sx=v=>m.l+v/10*(w-m.l-m.r),sy=v=>h-m.b-v/60*(h-m.t-m.b);
 let sc=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Average growth versus average stress by country">`;
 [0,20,40,60].forEach(t=>sc+=`<line x1="${m.l}" x2="${w-m.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--line)"/><text x="${m.l-8}" y="${sy(t)+4}" text-anchor="end">${t}</text>`);
 [0,2,4,6,8,10].forEach(t=>sc+=`<text x="${sx(t)}" y="${h-22}" text-anchor="middle">${t}</text>`);
 sc+=`<text x="${(m.l+w-m.r)/2}" y="${h-4}" text-anchor="middle">Average GDP growth, % a year</text><text transform="translate(12 ${h/2}) rotate(-90)" text-anchor="middle">Average stress index</text>`;
 const off={'Rwanda':[10,14],'Uganda':[-10,-10],'Tanzania':[10,-8],'Kenya':[0,-14]};
 st.forEach(s=>{const me=s.n===c,o=off[s.n]||[10,4];sc+=`<circle cx="${sx(s.g)}" cy="${sy(s.s)}" r="${me?9:6.5}" fill="${me?'var(--accent)':'var(--peer)'}" opacity="${me?1:.75}" stroke="var(--surface)" stroke-width="2"><title>${s.n}: growth ${f1(s.g)}%, stress ${f1(s.s)}</title></circle><text x="${sx(s.g)+o[0]}" y="${sy(s.s)+o[1]}" text-anchor="${o[0]<0?'end':o[0]===0?'middle':'start'}" class="${me?'k':'ink'}" style="${me?'font-weight:600':''}">${s.n}</text>`});
 sc+=`</svg>`;
 const mxs=Math.max(...st.map(s=>s.s)),mxg=Math.max(...st.map(s=>s.g));
 const rows=st.slice().sort((a,b)=>b.s-a.s).map(s=>`<tr class="${s.n===c?'me':''}"><td>${s.n}</td><td class="n"><div class="cellbar"><i style="width:${s.g/mxg*100}%"></i><span>${f1(s.g)}</span></div></td><td class="n">${f1(s.sd)}</td><td class="n">${f1(s.i)}</td><td class="n"><div class="cellbar"><i style="width:${s.s/mxs*100}%"></i><span>${f1(s.s)}</span></div></td><td class="n">${f1(s.l)}</td><td class="n">${f1(s.pk.stress_index)} (${s.pk.year})</td><td class="n">${s.sl}</td></tr>`).join('');
 const k=st.find(s=>s.n==='Kenya');
 return `<div class="grid g2"><div class="card"><h2>Lower stress, slower growth</h2><p class="sub">Each dot is one economy, averaged over 2000–2025. Kenya sits in the calm corner but grows slower than every East African neighbour.</p>${sc}</div>
 <div class="card"><h2>Why Kenya differs</h2><div style="display:grid;gap:14px;margin-top:8px">
  <div><div class="big">${f1(k.s)}</div><div class="note">Average stress index, against 51.6 for Ghana and 47.2 for Nigeria. Kenya never saw triple-digit depreciation or 40%-plus inflation.</div></div>
  <div><div class="big">${f1(k.g)}%</div><div class="note">Average growth, against 8.5% for Ethiopia, 7.5% for Rwanda and 5.9% for Tanzania and Uganda. Only South Africa is slower.</div></div>
  <div><div class="big">17.0%</div><div class="note">Investment share of GDP in 2025, down from 22.1% in 2015. Consistent with slower growth, but this data does not prove it.</div></div></div></div></div>
 <div class="card"><h2>Country comparison</h2><p class="sub">Sorted by average stress. The selected country is highlighted.</p><div class="scroll"><table><thead><tr><th>Country</th><th class="n">Growth %</th><th class="n">Growth SD</th><th class="n">Inflation %</th><th class="n">Avg stress</th><th class="n">${Y1} stress</th><th class="n">Peak stress</th><th class="n">Slump years</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
const R={overview:vOverview,stress:vStress,forecast:vForecast,scenarios:vScen,peers:vPeers};
function render(){
 Object.keys(R).forEach(k=>{const el=document.getElementById('v-'+k);el.hidden=k!==state.tab;if(k===state.tab)el.innerHTML=R[k]()});
 document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===state.tab));
 const m=document.getElementById('model');if(m)m.onchange=e=>{state.model=e.target.value;render()};
 document.querySelectorAll('[data-scn]').forEach(b=>b.onclick=()=>{state.scn=+b.dataset.scn;render()});
 const d=document.getElementById('dep');if(d)d.oninput=e=>{state.dep=+e.target.value;const v=21.4+0.716*state.dep,bd=bandOf(v);document.getElementById('dep-lab').textContent=state.dep+'%';document.getElementById('dep-out').innerHTML=`<div class="big" style="margin-top:10px">${f1(v)} <span class="pill ${bd}">${bd}</span></div>${gauge(v)}`};
}
const sel=document.getElementById('country');sel.innerHTML=COUNTRIES.map(c=>`<option ${c==='Kenya'?'selected':''}>${c}</option>`).join('');
sel.onchange=e=>{state.country=e.target.value;render()};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.tab=b.dataset.tab;try{history.replaceState(null,'','#'+state.tab)}catch(_){}render();scrollTo({top:0})};
try{const h=location.hash.slice(1);if(R[h])state.tab=h}catch(_){}
render();
</script>
